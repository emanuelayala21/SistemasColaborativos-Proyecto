<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuario</title>
    <link rel="stylesheet" href="./CSS_design/styles.css">
</head>
<body>

    <div class="register-container">
        <div class="register-box">
            <h2>Registro de Usuario</h2>
            
            <form id="registerForm">
                <div class="input-group">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" placeholder="Ej: Juan" required>
                </div>

                <div class="input-group">
                    <label for="email">Correo Electrónico:</label>
                    <input type="email" id="email" placeholder="Ej: juan@example.com" required>
                </div>

                <div class="input-group">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" placeholder="Mínimo 8 caracteres" required>
                </div>

                <button type="submit" class="register-btn">Crear Cuenta</button>
            </form>

        </div>
    </div>

    <script src="../../src/assets/js/js_Usuarios/script.js"></script>
</body>
</html>
