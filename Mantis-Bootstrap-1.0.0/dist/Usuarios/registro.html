<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="stylesheet" href="./CSS_design/login.css">
</head>
<body>

    <!-- Contenedor del mensaje en la parte superior -->
    <div id="registerMessage" class="register-message"></div>

    <div class="login-container">
        <div class="login-box">
            <h2>Registro</h2>
            
            <form id="registerForm">
                <div class="input-group">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" placeholder="Ej: Juan Pérez" required>
                </div>

                <div class="input-group">
                    <label for="email">Correo Electrónico:</label>
                    <input type="email" id="email" placeholder="Ej: juan@example.com" required>
                </div>

                <div class="input-group">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" placeholder="Mínimo 8 caracteres" required>
                </div>

                <button type="submit" class="login-btn">Registrarse</button>
                
                <!-- Botón para volver a iniciar sesión -->
                <button type="button" class="register-btn" onclick="location.href='login.html'">Iniciar Sesión</button>
            </form>
        </div>
    </div>

    <script src="../../src/assets/js/js_Usuarios/register.js"></script>
</body>
</html>
