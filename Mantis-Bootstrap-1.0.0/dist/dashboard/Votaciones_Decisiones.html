<!DOCTYPE html>
<html lang="en">

<head>
  <title>Votaciones y Toma de Decisiones</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=0, minimal-ui">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="description" content="Votaciones y Decisiones - Admin Dashboard">
  <meta name="keywords" content="Votaciones, Decisiones, Dashboard">
  <meta name="author" content="Tu Nombre">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="estilos/Votaciones_Decisiones.css">
</head>

<body>
  <header class="header-section">
    <h2 class="text-white text-center py-3">Votaciones y Toma de Decisiones</h2>
  </header>

  <div class="container mt-4">
    <div class="form-container">
      <h3 class="text-center">Proponer una Opción</h3>
      <form id="form-decision">
        <label for="categoria">Categoría:</label>
        <select id="categoria" class="form-select">
          <option value="Ubicación">Locación</option>
          <option value="Comida">Comida</option>
          <option value="Actividades">Actividades</option>
          <option value="Transporte">Transporte</option>
        </select>

        <label for="opcion">Opción:</label>
        <input type="text" id="opcion" class="form-control" placeholder="Ej: Restaurante Italiano" required>

        <button type="submit" class="btn btn-primary mt-3 w-100">Añadir Opción</button>
      </form>
    </div>

    <div class="list-container mt-4">
      <h3 class="text-center">Opciones para Votar</h3>
      <ul id="lista-decisiones" class="list-group">
        <!-- Aquí se mostrarán las opciones propuestas -->
      </ul>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../src/assets/js/auth.js"></script>
</body>

</html>
