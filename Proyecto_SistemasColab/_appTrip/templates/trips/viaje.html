{% load static %}

<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Viaje - Muro</title>
  <link rel="icon" href="../assets/images/favicon.svg" type="image/x-icon">
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>
  <header class="pc-header">
    <div class="container">
      <div class="d-flex justify-content-between align-items-center">
        <h2 class="header-title">Viaje - Muro</h2>
        <button class="btn btn-danger ms-3" id="logout-btn">
          <i class="bi bi-box-arrow-right me-2"></i> Cerrar sesión
        </button>
      </div>
    </div>
  </header>

  <div class="container mt-5">
    <div class="row">
      <!-- Información del viaje -->
      <div class="col-md-2">
        <div id="viaje-info" class="card shadow-sm">
          <!-- Información se insertará dinámicamente -->
        </div>
      </div>

      <!-- Notas importantes y votaciones -->
      <div class="col-md-7">
        <div id="notas-importantes" class="card shadow-sm">
          <h3>Publicaciones</h3>
          <!-- Notas y votaciones se insertarán dinámicamente -->
        </div>
        <!-- Formulario para crear una publicación -->
        <div id="crear-publicacion" class="card shadow-sm mt-4">
          <div class="card-body">
            <h5 class="card-title">Crear publicación</h5>
            <form id="form-publicacion">
              <div class="mb-3">
                <label for="titulo" class="form-label">Título</label>
                <input type="text" class="form-control" id="titulo" required>
              </div>
              <div class="mb-3">
                <label for="contenido" class="form-label">Nota</label>
                <textarea class="form-control" id="contenido" rows="4" required></textarea>
              </div>
              <button type="submit" class="btn btn-primary">Agregar publicación</button>
            </form>
          </div>
        </div>
      </div>

      <!-- Participantes -->
      <div class="col-md-3">
        <div id="participantes" class="card shadow-sm">
          <!-- Participantes se insertarán dinámicamente -->
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
<script>
  function getCookie(name) {
    const value = `; ${document.cookie}`;
    const parts = value.split(`; ${name}=`);
    if (parts.length === 2) return parts.pop().split(';').shift();
  }

  document.addEventListener("DOMContentLoaded", async () => {
    const viajeId = getCookie('viaje_id'); // obtener desde cookie
    const token = localStorage.getItem("access_token");

    if (!token || !viajeId) {
      window.location.href = "/login/";
      return;
    }

    try {
      // Obtener información del viaje
      const response = await fetch(`http://localhost:8000/api/viaje/${viajeId}/`, {
        headers: { "Authorization": `Bearer ${token}` }
      });

      if (!response.ok) throw new Error("Error al cargar el viaje");

      const viaje = await response.json();

      document.getElementById("viaje-info").innerHTML = `
        <div class="card-body">
          <h5 class="card-title">${viaje.titulo}</h5>
          <p class="card-text">${viaje.descripcion}</p>
          <p><strong>Inicio:</strong> ${viaje.fecha_inicio}</p>
          <p><strong>Fin:</strong> ${viaje.fecha_fin}</p>
          <p><strong>Creado por:</strong> ${viaje.creador_nombre}</p>
          <p><strong>Código de invitación:</strong> <code>${viaje.codigo_invitacion}</code></p>
        </div> `;

      // Obtener los participantes
      const participantesResponse = await fetch(`http://localhost:8000/api/viaje/participantes/${viajeId}/`, {
        headers: { "Authorization": `Bearer ${token}` }
      });

      const participantes = await participantesResponse.json();
      const participantesContainer = document.getElementById("participantes");
      participantesContainer.innerHTML = `<div class="card-body"><h5 class="card-title">Participantes</h5></div>`;
      participantes.forEach(p => {
        participantesContainer.innerHTML += `
        <div class="list-group-item">${p.usuario_nombre}</div>
      `;
      });

      // Obtener notas importantes
      const notasResponse = await fetch(`http://localhost:8000/api/viaje/notas/${viajeId}/`, {
        headers: { "Authorization": `Bearer ${token}` }
      });

      if (!notasResponse.ok) throw new Error("Error al cargar las notas importantes");

      const notas = await notasResponse.json();
      const notasContainer = document.getElementById("notas-importantes");


      if (notas.length === 0) {
        notasContainer.innerHTML += `<p>No hay notas publicaciones aún.</p>`;
      } else {
        notas.forEach(nota => {
          const notaDiv = document.createElement("div");
          notaDiv.classList.add("card", "mb-2", "p-2");
          notaDiv.innerHTML = `
          <h6>${nota.titulo}</h6>
          <p>${nota.contenido}</p>
          <small><strong>Por:</strong> ${nota.usuario_nombre} | ${nota.fecha_creacion}</small>
        `;
          notasContainer.appendChild(notaDiv);
        });
      } const form = document.getElementById("form-publicacion");
      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const titulo = document.getElementById("titulo").value;
        const contenido = document.getElementById("contenido").value;

        if (!titulo || !contenido) {
          alert("Por favor, completa todos los campos.");
          return;
        }

        try {
          const response = await fetch(`http://localhost:8000/api/viaje/notas/${viajeId}/crear/`, {
            method: 'POST',
            headers: {
              "Authorization": `Bearer ${token}`,
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              titulo: titulo,
              contenido: contenido,
            }),
          });

          if (response.ok) {
            const nuevaNota = await response.json();
            // Aquí puedes agregar la nueva nota a la vista sin recargar la página
            const notaDiv = document.createElement("div");
            notaDiv.classList.add("card", "mb-2", "p-2");
            notaDiv.innerHTML = `
      <h6>${nuevaNota.titulo}</h6>
      <p>${nuevaNota.contenido}</p>
      <small><strong>Por:</strong> ${nuevaNota.usuario_nombre} | ${nuevaNota.fecha_creacion}</small>
    `;
            // Usamos appendChild para agregar la nueva nota después de las existentes
            notasContainer.appendChild(notaDiv); // Agregar la nueva nota al final
            form.reset();
          } else {
            throw new Error("Error al crear la publicación.");
          }
        } catch (error) {
          console.error("Error al crear la publicación:", error);
        }
      });

    } catch (error) {
      console.error("Error al cargar los datos:", error);
    }

  });

</script>

</html>
