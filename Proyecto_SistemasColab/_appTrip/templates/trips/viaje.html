{% load static %}

<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Viaje - Muro</title>
  <link rel="icon" href="../assets/images/favicon.svg" type="image/x-icon">
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>
  <header class="pc-header">
    <div class="container">
      <div class="d-flex justify-content-between align-items-center">
        <h2 class="header-title">Viaje - Muro</h2>
        <button class="btn btn-danger ms-3" id="logout-btn">
          <i class="bi bi-box-arrow-right me-2"></i> Cerrar sesión
        </button>
      </div>
    </div>
  </header>

  <div class="container mt-5">
    <div class="row">
      <!-- Información del viaje -->
      <div class="col-md-2">
        <div id="viaje-info" class="card shadow-sm">
          <!-- Información se insertará dinámicamente -->
        </div>
      </div>

      <!-- Notas importantes y votaciones -->
      <div class="col-md-8">
        <div id="notas-importantes" class="card shadow-sm">
          <!-- Notas y votaciones se insertarán dinámicamente -->
        </div>
        
      </div>

      <!-- Participantes -->
      <div class="col-md-2">
        <div id="participantes" class="card shadow-sm">
          <!-- Participantes se insertarán dinámicamente -->
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
<script>
  function getCookie(name) {
    const value = `; ${document.cookie}`;
    const parts = value.split(`; ${name}=`);
    if (parts.length === 2) return parts.pop().split(';').shift();
  }

  document.addEventListener("DOMContentLoaded", async () => {
    const viajeId = getCookie('viaje_id'); // obtener desde cookie
    const token = localStorage.getItem("access_token");

    if (!token || !viajeId) {
      window.location.href = "/login/";
      return;
    }

    try {
      // Obtener información del viaje
      const response = await fetch(`http://localhost:8000/api/viaje/${viajeId}/`, {
        headers: { "Authorization": `Bearer ${token}` }
      });

      if (!response.ok) throw new Error("Error al cargar el viaje");

      const viaje = await response.json();

      document.getElementById("viaje-info").innerHTML = `
        <div class="card-body">
          <h5 class="card-title">${viaje.titulo}</h5>
          <p class="card-text">${viaje.descripcion}</p>
          <p><strong>Inicio:</strong> ${viaje.fecha_inicio}</p>
          <p><strong>Fin:</strong> ${viaje.fecha_fin}</p>
          <p><strong>Creado por:</strong> ${viaje.creador_nombre}</p>
          <p><strong>Código de invitación:</strong> <code>${viaje.codigo_invitacion}</code></p>
        </div> `;

      // Obtener los participantes
      const participantesResponse = await fetch(`http://localhost:8000/api/viaje/participantes/${viajeId}/`, {
        headers: { "Authorization": `Bearer ${token}` }
      });

      const participantes = await participantesResponse.json();
      const participantesContainer = document.getElementById("participantes");
      participantesContainer.innerHTML = `<div class="card-body"><h5 class="card-title">Participantes</h5></div>`;
      participantes.forEach(p => {
        participantesContainer.innerHTML += `
        <div class="list-group-item">${p.usuario_nombre}</div>
      `;
      });

      // Obtener notas importantes
      const notasResponse = await fetch(`http://localhost:8000/api/viaje/notas/${viajeId}/`, {
        headers: { "Authorization": `Bearer ${token}` }
      });

      if (!notasResponse.ok) throw new Error("Error al cargar las notas importantes");

      const notas = await notasResponse.json();
      const notasContainer = document.getElementById("notas-importantes");

      notasContainer.innerHTML = "<h5>Publicaciones</h5>";
      if (notas.length === 0) {
        notasContainer.innerHTML += `<p>No hay notas publicaciones aún.</p>`;
      } else {
        notas.forEach(nota => {
          const notaDiv = document.createElement("div");
          notaDiv.classList.add("card", "mb-2", "p-2");
          notaDiv.innerHTML = `
          <h6>${nota.titulo}</h6>
          <p>${nota.contenido}</p>
          <small><strong>Por:</strong> ${nota.usuario_nombre} | ${nota.fecha_creacion}</small>
        `;
          notasContainer.appendChild(notaDiv);
        });
      }

    } catch (error) {
      console.error("Error al cargar los datos:", error);
    }
  });

</script>

</html>
