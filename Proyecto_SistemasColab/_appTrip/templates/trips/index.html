{% load static %}

<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Sistema de Viajes - Dashboard</title>
  <link rel="icon" href="../assets/images/favicon.svg" type="image/x-icon">
  <!-- Font and Bootstrap CSS -->
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static '../static/trips/css/tabler-icons.min.css' %}">
  <link rel="stylesheet" href="{% static '../static/trips/css/fontawesome.css' %}">
  <link rel="stylesheet" href="{% static '../static/trips/css/style_dashboard.css' %}">
</head>

<body>
  <header class="pc-header">
    <div class="container">
      <div class="d-flex justify-content-between align-items-center">
        <!-- Logo / Título -->
        <h2 class="header-title">Sistema de Viajes</h2>

        <!-- Navbar Toggle para pantallas pequeñas -->
        <button class="navbar-toggler d-md-none" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
          aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Menú de navegación -->
        <nav class="collapse navbar-collapse d-md-flex" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <button class="btn btn-main me-2" onclick="location.href='/api/viaje/gestion/'">
                <i class="bi bi-briefcase me-2"></i> Gestión de Viajes
              </button>
            </li>
            <li class="nav-item">
              <button class="btn btn-main me-2" onclick="location.href='../dashboard/Votaciones_Decisiones.html'">
                <i class="bi bi-check-circle me-2"></i> Votaciones y Toma de Decisiones
              </button>
            </li>
            <li class="nav-item">
              <button class="btn btn-main" onclick="location.href='../dashboard/reportes.html'">
                <i class="bi bi-file-earmark-pdf me-2"></i> Reportes de Viajes
              </button>
            </li>
            <li class="nav-item">
              <button class="btn btn-danger ms-3" id="logout-btn">
                <i class="bi bi-box-arrow-right me-2"></i> Cerrar sesión
              </button>
            </li>
          </ul>
        </nav>
      </div>
    </div>
  </header>
  <h3 class="text-center mb-4">Tus Viajes</h3>

  <div class="text-center mb-4">
    <input type="text" id="codigoViaje" class="form-control d-inline-block w-auto me-2" placeholder="Código del viaje">
    <button class="btn btn-success" onclick="unirseAViaje()">Unirse</button>
    <p id="mensaje-unirse" class="mt-2"></p>
  </div>
  <div id="viajes-container" class="row justify-content-center">
   
    <div class="container mt-5">
      
     
      <div id="viajes-container" class="row justify-content-center gap-4">
        <!-- Aquí se insertan las tarjetas -->
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{% static 'js/auth.js' %}"></script>
  <script src="{% static 'js/cerrar_sesion.js' %}"></script>
</body>
 <script>
  document.addEventListener("DOMContentLoaded", async () => {
    const container = document.getElementById("viajes-container");
    const token = localStorage.getItem("access_token");
    const viajeImageUrl = "{% static '../static/trips/images/landscape.jpg' %}";

    // Si no hay token, redirigir al login
    if (!token) {
      window.location.href = "/login/";
      return;
    }

    try {
      const response = await fetch("http://localhost:8000/api/viaje/incluido/", {
        headers: {
          "Authorization": "Bearer " + token
        }
      });

      if (!response.ok) {
        throw new Error("Error al cargar los viajes");
      }

      const viajes = await response.json();
      container.innerHTML = "";

      if (viajes.length === 0) {
        container.innerHTML = `<p class="text-center">No estás incluido en ningún viaje.</p>`;
        return;
      }

      viajes.forEach(viaje => {
        const card = document.createElement("div");
        card.className = "card col-md-5 col-lg-4 shadow-sm p-0";

        card.innerHTML = `
          <img src="${viajeImageUrl}" class="card-img-top" alt="Imagen del viaje">
          <div class="card-body">
            <h5 class="card-title">${viaje.titulo}</h5>
            <p class="card-text">
              <strong>Inicio:</strong> ${viaje.fecha_inicio} <br>
              <strong>Fin:</strong> ${viaje.fecha_fin}
            </p>
            <button class="btn btn-outline-primary w-100" onclick="handleIrAViaje(${viaje.id})">Ir a viaje</button>
          </div>`;

        container.appendChild(card);
      });

    } catch (error) {
      console.error("Error al obtener los viajes:", error);
      container.innerHTML = `<p class="text-danger text-center">Hubo un error al cargar los viajes.</p>`;
    }
  });

  function handleIrAViaje(viajeId) {
  document.cookie = `viaje_id=${viajeId}; path=/`;

  // Redirigir a la página del viaje
  window.location.href = `/api/viaje/viaje_muro/`;
  }
  async function unirseAViaje() {
      const codigo = document.getElementById("codigoViaje").value.trim();
      const token = localStorage.getItem("access_token");
      const mensaje = document.getElementById("mensaje-unirse");

      if (!codigo) {
        mensaje.textContent = "Por favor, ingresa un código.";
        mensaje.className = "text-danger";
        return;
      }

      try {
        const response = await fetch("http://localhost:8000/api/viaje/unirse/", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + token
          },
          body: JSON.stringify({ codigo: codigo })
        });

        const data = await response.json();

        if (response.ok) {
          mensaje.textContent = "¡Te has unido correctamente al viaje!";
          mensaje.className = "text-success";
          setTimeout(() => window.location.reload(), 1500);
        } else {
          mensaje.textContent = data.detail || "No se pudo unir al viaje.";
          mensaje.className = "text-danger";
        }
      } catch (error) {
        mensaje.textContent = "Error al conectar con el servidor.";
        mensaje.className = "text-danger";
      }
    }
  </script>

</html>
