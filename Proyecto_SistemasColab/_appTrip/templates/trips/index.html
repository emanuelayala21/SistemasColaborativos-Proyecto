{% load static %}

<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Sistema de Viajes - Dashboard</title>
  <link rel="icon" href="../assets/images/favicon.svg" type="image/x-icon">
  <!-- Font and Bootstrap CSS -->
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static '../static/trips/css/tabler-icons.min.css' %}">
  <link rel="stylesheet" href="{% static '../static/trips/css/fontawesome.css' %}">
  <link rel="stylesheet" href="{% static '../static/trips/css/style_dashboard.css' %}">
</head>

<body>
  <header class="pc-header">
    <div class="container">
      <div class="d-flex justify-content-between align-items-center">
        <!-- Logo / Título -->
        <h2 class="header-title">Sistema de Viajes</h2>

        <!-- Navbar Toggle para pantallas pequeñas -->
        <button class="navbar-toggler d-md-none" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Menú de navegación -->
        <nav class="collapse navbar-collapse d-md-flex" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <button class="btn btn-main me-2" onclick="location.href='/api/viaje/gestion/'">
                <i class="bi bi-briefcase me-2"></i> Gestión de Viajes
              </button>
            </li>
            <li class="nav-item">
              <button class="btn btn-main me-2" onclick="location.href='../dashboard/Votaciones_Decisiones.html'">
                <i class="bi bi-check-circle me-2"></i> Votaciones y Toma de Decisiones
              </button>
            </li>
            <li class="nav-item">
              <button class="btn btn-main" onclick="location.href='../dashboard/reportes.html'">
                <i class="bi bi-file-earmark-pdf me-2"></i> Reportes de Viajes
              </button>
            </li>
            <li class="nav-item">
              <button class="btn btn-danger ms-3" id="logout-btn">
                <i class="bi bi-box-arrow-right me-2"></i> Cerrar sesión
              </button>
            </li>
          </ul>
        </nav>
      </div>
    </div>
  </header>

  <div class="container container-content text-center">
    <h3 class="mb-4">Panel de Control</h3>
    <p>Accede a las funcionalidades de gestión de viajes, toma de decisiones y reportes.</p>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{% static 'js/auth.js' %}"></script>
  <script src="{% static 'js/cerrar_sesion.js' %}"></script>
</body>

</html>
