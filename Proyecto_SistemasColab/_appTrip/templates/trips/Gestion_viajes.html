{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
  <title>Gestión de Viajes</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=0, minimal-ui">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="description" content="Gestión de Viajes - Admin Dashboard">
  <meta name="keywords" content="Viajes, Dashboard, Gestión">
  <meta name="author" content="Tu Nombre">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="{% static '../static/trips/css/Style_Gestion_Viajes.css' %}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="{% static '../static/trips/css/tabler-icons.min.css' %}">
  <link rel="stylesheet" href="{% static '../static/trips/css/fontawesome.css' %}">
  <link rel="stylesheet" href="{% static '../static/trips/css/style_dashboard.css' %}">
  <link rel="stylesheet" href="{% static '../static/trips/css/index.css' %}">

</head>

<body>
  <header class="pc-header">
    <div class="navbar-custom">
      <div class="navbar-title">Sistema de Viajes</div>
      <nav class="navbar-links">
        <a href="/api/viaje/viaje_info/">Tus Viajes</a>
        <a href="/api/viaje/gestion/">Crear Viajes</a>
        <a href="../dashboard/Votaciones_Decisiones.html">Votaciones</a>
        <a href="../dashboard/reportes.html">Reportes de Viajes</a>
        <a href="#" id="logout-btn" class="logout-link">Cerrar sesión</a>
      </nav>
    </div>
  </header>
  <nav class="titulo-navbar">
    <div class="container-fluid d-flex justify-content-center align-items-center">
      <h2 class="titulo-pagina">Crear Viaje</h2>
    </div>
  </nav>

  <div class="container mt-4">
    <div class="form-container">
      <h3 class="text-center">Crear un Nuevo Viaje</h3>
      <form id="form-viajes">
        <label for="nombre">Nombre del Viaje:</label>
        <input type="text" id="nombre" class="form-control" placeholder="Ej: San Carlos 2023" required>

        <label for="fecha-inicio">Fecha de Inicio:</label>
        <input type="date" id="fecha-inicio" class="form-control" required>

        <label for="fecha-fin">Fecha de Fin:</label>
        <input type="date" id="fecha-fin" class="form-control" required>

        <label for="descripcion">Descripción:</label>
        <textarea id="descripcion" class="form-control" rows="3" placeholder="Detalles sobre el viaje..."
          required></textarea>

        <button type="submit" class="btn btn-primary mt-3 w-100">Crear Viaje</button>
      </form>
    </div>

    <!-- Mensaje de éxito -->
    <div id="mensaje-exito" style="display: none;">
      ¡Viaje creado exitosamente!
    </div>

    <div class="list-container mt-4">
      <h3 class="text-center">Viajes Creados</h3>
      <ul id="viajes-lista" class="list-group">
        <!-- Aquí se mostrarán los viajes creados -->
        <li class="list-group-item d-flex justify-content-between align-items-center">
          Viaje a San Carlos
          <button class="btn btn-warning btn-sm" onclick="editarViaje(1)">Modificar</button>
        </li>
      </ul>
    </div>
  </div>

  <!-- Formulario de Modificación (Cuadro flotante) -->
  <div id="form-modificar-viaje"
    style="display: none; position: fixed; top: 10%; left: 50%; transform: translateX(-50%); background-color: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2); width: 80%; max-width: 500px;">
    <h3>Modificar Viaje</h3>
    <form id="form-modificar">
      <input type="hidden" id="viaje-id">
      <label for="nombre-mod">Nombre del Viaje:</label>
      <input type="text" id="nombre-mod" class="form-control" required>

      <label for="fecha-inicio-mod">Fecha de Inicio:</label>
      <input type="date" id="fecha-inicio-mod" class="form-control" required>

      <label for="fecha-fin-mod">Fecha de Fin:</label>
      <input type="date" id="fecha-fin-mod" class="form-control" required>

      <label for="descripcion-mod">Descripción:</label>
      <textarea id="descripcion-mod" class="form-control" rows="3" required></textarea>

      <button type="submit" class="btn btn-primary mt-3 w-100">Actualizar Viaje</button>
    </form>
    <button class="btn btn-secondary mt-3" onclick="cerrarFormulario()">Cerrar</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{% static 'js/auth.js' %}"></script>
  <script src="{% static '../static/trips/js/crearviaje.js' %}"></script>
  <script src="{% static '../static/trips/js/misviajes.js' %}"></script>
  <script src="{% static '../static/trips/js/deleteviaje.js' %}"></script>
  <script>
    // Función para mostrar el formulario de edición con los datos del viaje
    async function editarViaje(viajeId) {
      try {
        const response = await fetch(`http://localhost:8000/api/viaje/${viajeId}/`, {
          headers: {
            'Authorization': 'Bearer ' + localStorage.getItem('access_token')
          }
        });
        const viaje = await response.json();
        if (response.ok) {
          document.getElementById('viaje-id').value = viaje.id;
          document.getElementById('nombre-mod').value = viaje.titulo;
          document.getElementById('fecha-inicio-mod').value = viaje.fecha_inicio;
          document.getElementById('fecha-fin-mod').value = viaje.fecha_fin;
          document.getElementById('descripcion-mod').value = viaje.descripcion;

          document.getElementById('form-modificar-viaje').style.display = 'block';
        } else {
          console.error('Error al obtener los datos del viaje');
        }
      } catch (error) {
        console.error('Error de conexión:', error);
      }
    }

    // Función para cerrar el formulario de modificación
    function cerrarFormulario() {
      document.getElementById('form-modificar-viaje').style.display = 'none';
    }

    // Función para actualizar el viaje
    async function actualizarViaje(event) {
      event.preventDefault();
      const viajeId = document.getElementById('viaje-id').value;
      const viajeData = {
        titulo: document.getElementById('nombre-mod').value,
        fecha_inicio: document.getElementById('fecha-inicio-mod').value,
        fecha_fin: document.getElementById('fecha-fin-mod').value,
        descripcion: document.getElementById('descripcion-mod').value
      };

      try {
        const response = await fetch(`http://localhost:8000/api/viaje/${viajeId}/`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + localStorage.getItem('access_token')
          },
          body: JSON.stringify(viajeData)
        });

        if (response.ok) {

          // Aquí puedes modificar directamente el viaje en la lista sin recargar toda la lista
          const viajeModificado = await response.json();
            const viajeElemento = document.querySelector(`.viaje-item[data-id='${viajeModificado.id}']`);

            if (viajeElemento) {
                viajeElemento.querySelector('.viaje-info h5').innerText = viajeModificado.titulo;
                viajeElemento.querySelector('.viaje-info p').innerHTML = `
                    <strong>Inicio:</strong> ${viajeModificado.fecha_inicio} <strong>Fin:</strong> ${viajeModificado.fecha_fin}
                    <p>${viajeModificado.descripcion}</p>
                `;
            }

          // Mostrar mensaje bonito con SweetAlert2
          Swal.fire({
            title: '¡Éxito!',
            text: 'El viaje ha sido actualizado correctamente.',
            icon: 'success',
            confirmButtonText: '¡Genial!',
            customClass: {
              confirmButton: 'btn btn-success'
            },
            background: '#f8f9fa', // Fondo claro para el mensaje
            buttonsStyling: false // Desactivar los estilos predeterminados
          });

          // Ocultar el formulario de modificación después de la actualización
          document.getElementById('form-modificar-viaje').style.display = 'none';

          // Recargar los viajes después de la actualización (si es necesario)
          obtenerViajes();
        } else {
          console.error('Error al actualizar el viaje');
        }
      } catch (error) {
        console.error('Error de conexión al actualizar el viaje:', error);
      }
    }

    // Añadir el evento al formulario de modificación
    document.addEventListener('DOMContentLoaded', function () {
      document.getElementById('form-modificar').addEventListener('submit', actualizarViaje);
    });
  </script>
</body>

</html>
