{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña</title>
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>
<body>

<div class="login-container">
    <div class="login-box">
        <h2>Recuperar Contraseña</h2>

        {% if messages %}
            <div class="alert-container">
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }}">
                        {{ message }}
                    </div>
                {% endfor %}
            </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="input-group">
                <label for="correo">Correo Electrónico:</label>
                <input type="email" id="correo" name="correo" placeholder="Ej: juan@example.com" required>
            </div>

            <button type="submit" class="login-btn">Enviar nueva contraseña</button>
            <button type="button" class="register-btn" onclick="window.location.href='{% url 'login_html' %}'">Volver al login</button>

        </form>
    </div>
</div>

</body>
</html>
