{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Recuperar Contraseña</title>
    <link rel="stylesheet" href="{% static '../static/users/css/login.css' %}">
</head>
<body>
<div class="login-container">
    <div class="login-box">
        <h2>Recuperar Contraseña</h2>
        <form id="recuperar-form">
            <div class="input-group">
                <label for="correo">Correo Electrónico:</label>
                <input type="email" id="correo" name="correo" placeholder="Ej: juan@example.com" required>
            </div>
            <button type="submit" class="login-btn">Enviar nueva contraseña</button>
        </form>
        <div id="mensaje" style="margin-top: 15px; text-align: center;"></div>
    </div>
</div>
<script src="{% static '../static/users/js/recuperar.js' %}"></script>
</body>
</html>
