{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" href="{% static '../static/users/css/login.css' %}">
</head>
<body>

    <div class="login-container">
        <div class="login-box">
            <h2>Iniciar Sesión</h2>
            
            <form id="loginForm">
                <div class="input-group">
                    <label for="email">Correo Electrónico:</label>
                    <input type="email" id="email" placeholder="Ej: juan@example.com" required>
                </div>
                <div class="input-group">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" placeholder="Ingresa tu contraseña" required>
                </div>

                <button type="submit" class="login-btn">Iniciar Sesión</button>
                
                <!-- Botón de registro con mejor diseño -->
                <button type="button" class="register-btn" onclick="location.href='/api/usuario/registro_page/'">Registrarse</button>
            </form>

            <div id="loginMessage" class="login-message"></div>
        </div>
    </div>

    <script src="{% static '../static/users/js/login.js' %}"></script>
</body>
</html>
