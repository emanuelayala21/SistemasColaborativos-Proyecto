{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    
    <!-- Enlace correcto al archivo CSS dentro de /static/css/login.css -->
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>
<body>

    <div class="login-container">
        <div class="login-box">
            <h2>Iniciar Sesión</h2>

            <form id="loginForm" method="post">
                {% csrf_token %}
                
                <div class="input-group">
                    <label for="email">Correo Electrónico:</label>
                    <input type="email" id="email" name="correo" placeholder="Ej: juan@example.com" required>
                </div>

                <div class="input-group">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="contrasena" placeholder="Ingresa tu contraseña" required>
                </div>

                <button type="submit" class="login-btn">Iniciar Sesión</button>

                <button type="button" class="register-btn" onclick="location.href='/api/usuario/registro_html/'">Registrarse</button>


                <p><a href="{% url 'recuperar_contrasena' %}">¿Olvidaste tu contraseña?</a></p>
            </form>

            <div id="loginMessage" class="login-message">
                {% for message in messages %}
                    <p>{{ message }}</p>
                {% endfor %}
            </div>
        </div>
    </div>

    <!-- Script JS (ajustá si tenés archivo personalizado en /static/js/) -->
    <script src="{% static 'js/login.js' %}"></script>
</body>
</html>
