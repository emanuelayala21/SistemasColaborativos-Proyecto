<!DOCTYPE html>
{% load static %}
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>
<body>

    <div id="registerMessage" class="register-message"></div>

    <div class="login-container">
        <div class="login-box">
            <h2>Registro</h2>
            
            <form id="registerForm">
                <div class="input-group">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" placeholder="Ej: Juan Pérez" required>
                </div>

                <div class="input-group">
                    <label for="email">Correo Electrónico:</label>
                    <input type="email" id="email" placeholder="Ej: juan@example.com" required>
                </div>

                <div class="input-group">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" placeholder="Mínimo 8 caracteres" required>
                </div>

                <button type="submit" class="login-btn">Registrarse</button>
                
                <button type="button" class="register-btn" onclick="location.href='/api/usuario/login_html/'">Iniciar Sesión</button>
            </form>
        </div>
    </div>

    <script src="{% static 'js/register.js' %}"></script>
</body>
</html>
